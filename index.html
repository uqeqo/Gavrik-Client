<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гаврик Client — Магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Название изменено на ГАВРИК CLIENT -->
        <div class="logo">ГАВРИК<span>CLIENT</span></div>
    </header>

    <main class="main-container">
        <!-- СЛЕВА: Блок покупки Гаврик Client -->
        <section class="left-side">
            <div class="box buy-box">
                <!-- Название изменено на ГАВРИК CLIENT -->
                <h2>Лицензия ГАВРИК CLIENT</h2>
                <p>Получи доступ ко всем неоновым эффектам, кастомному HUD и шлейфам навсегда.</p>
                <!-- Цены полностью убраны -->
                <button class="btn btn-buy" onclick="alert('Перенаправление на оплату...')">Купить лаунчер</button>
            </div>
        </section>

        <!-- СПРАВА: Колесо фортуны с новыми призами -->
        <section class="right-side">
            <div class="box fortune-box">
                <h2>Колесо Фортуны</h2>
                <p>Испытай удачу и выбей крутой бонус для своего клиента!</p>
                
                <div class="wheel-container">
                    <div class="pointer">▼</div>
                    <div class="wheel" id="wheel">
                        <!-- Названия секторов сокращены, чтобы они красиво влезали в круг -->
                        <div class="segment" style="--i:1; --clr:#000000;"><span>Чит 30д</span></div>
                        <div class="segment" style="--i:2; --clr:#00ff00;"><span>10 Руб</span></div>
                        <div class="segment" style="--i:3; --clr:#000000;"><span>Промо 9%</span></div>
                        <div class="segment" style="--i:4; --clr:#00ff00;"><span>Чит 180д</span></div>
                    </div>
                </div>

                <button class="btn btn-fortune" id="spinBtn">Крутить за 49₽</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
