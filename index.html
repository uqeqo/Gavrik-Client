<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гаврик Client — Лучший чит на Minecraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта с мобильным меню -->
    <header>
        <div class="logo">ГАВРИК<span>CLIENT</span> <mark class="version-tag">1.21.4</mark></div>
        
        <button class="menu-toggle" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </button>

        <nav class="dropdown-menu" id="dropdownMenu">
            <a href="index.html">Главная</a>
            <!-- Обновлена почта поддержки в уведомлении -->
            <a href="#" onclick="alert('m6296778@gmail.com (ПН-ПТ 10:00-18:00 МСК)')">Поддержка</a>
            <a href="#" onclick="handleBuyRedirect()">Купить</a>
            <a href="auth.html" id="menuAuthBtn" class="nav-auth-btn">Авторизация</a>
        </nav>
    </header>

    <main class="main-container">
        <section class="center-side hero-section">
            <div class="hero-content">
                <span class="badge-opt">Лучшая оптимизация</span>
                <h1>О нас</h1>
                <p>Мы предоставляем вам лучший приватный клиент для комфортной игры, который даст вам наилучшие впечатления от игры и полный контроль над оппонентами.</p>
                
                <div class="hero-buttons">
                    <button class="btn btn-buy" onclick="handleBuyRedirect()">⚡ Купить софт</button>
                    <button class="btn btn-secondary" onclick="alert('ГАВРИК CLIENT 1.21.4 включает: KillAura, Fly, XRay, HUD в стиле macOS и обходы античитов.')">Подробнее →</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('active');
        }

        function handleBuyRedirect() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                window.location.href = 'buy.html';
            } else {
                alert('Для покупки софта необходимо авторизоваться в системе!');
                window.location.href = 'auth.html';
            }
        }

        window.onload = function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const authBtn = document.getElementById('menuAuthBtn');
            if (isLoggedIn === 'true') {
                authBtn.innerText = 'Личный кабинет';
                authBtn.href = 'profile.html';
                authBtn.style.background = '#006600';
            }
        };
    </script>
</body>
</html>
