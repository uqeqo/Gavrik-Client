<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покупка подписки — ГАВРИК CLIENT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pay-container {
            max-width: 500px;
            width: 90%;
            margin: 60px auto;
            background: rgba(12, 18, 12, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 0, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .pay-container h2 { font-size: 22px; font-weight: 600; margin-bottom: 25px; line-height: 1.4; }
        .tab-container { display: flex; background: rgba(0, 0, 0, 0.4); border-radius: 10px; padding: 5px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .tab-btn { flex: 1; background: transparent; border: none; color: #a0b0a0; padding: 12px 5px; font-size: 15px; font-weight: 700; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        
        /* Исправленный класс для точного отображения зеленой марки */
        .tab-btn.active { background: #00ff00 !important; color: #000000 !important; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3); }
        
        .price-display { font-size: 16px; color: #ffffff; margin-bottom: 25px; font-weight: 500; }
        .price-amount { font-size: 28px; font-weight: 800; color: #00ff00; margin: 0 6px; text-shadow: 0 0 10px rgba(0, 255, 0, 0.2); }
        .old-price-strike { font-size: 18px; text-decoration: line-through; color: #556655; margin-right: 5px; }
        .discount-badge { background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin-left: 5px; vertical-align: middle; }
        .promo-input { width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.5); border: 1px solid #223322; border-radius: 10px; color: #fff; font-size: 15px; text-align: center; margin-bottom: 15px; transition: 0.2s; }
        .promo-input:focus { border-color: #00ff00; outline: none; box-shadow: 0 0 10px rgba(0, 255, 0, 0.15); }
        .promo-status { font-size: 13px; margin-bottom: 20px; display: block; font-weight: 600; }
        .btn-funpay { background: #ffffff; color: #000000; margin-top: 12px; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; }
        .btn-funpay span { font-weight: 800; letter-spacing: 0.5px; }
        .btn-funpay span font { color: #0055ff; }
        .btn-funpay:hover { background: #eeeeee; transform: translateY(-2px); }
        .btn-cancel { background: transparent; color: #a0b0a0; border: 1px solid #223322; margin-top: 20px; padding: 12px; font-size: 14px; }
        .btn-cancel:hover { color: #ff3333; border-color: #ff3333; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ГАВРИК<span>CLIENT</span></div>
    </header>

    <div class="pay-container">
        <h2 id="payTitle">Покупка «Клиент 1.21.4 на 30 дней»</h2>

        <div class="tab-container">
            <button class="tab-btn active" id="tab30" onclick="changeTariff('30 дней', 299, 0, 0, this)">30 дней</button>
            <button class="tab-btn" id="tab90" onclick="changeTariff('90 дней', 499, 554, 10, this)">90 дней</button>
            <button class="tab-btn" id="tabInf" onclick="changeTariff('Навсегда', 699, 932, 25, this)">Навсегда</button>
        </div>

        <div class="price-display" id="priceDisplay">
            К оплатe:<span class="price-amount" id="finalPrice">299 ₽</span>
        </div>

        <input type="text" class="promo-input" id="promoCode" oninput="applyPromo()" placeholder="Введите промокод (не обязательно)">
        <span class="promo-status" id="promoStatus" style="color: #666;">Промокод не введен</span>

        <button class="btn btn-buy" onclick="executePayment()">➔ Продолжить к оплате</button>
        
        <button class="btn btn-funpay" onclick="alert('Перенаправление на продавца FunPay...')">
            Оплатить через &nbsp; <span>FUN<font>PAY</font></span>
        </button>

        <!-- Кнопка отмены теперь возвращает строго на главную без цикличных вылетов -->
        <button class="btn btn-cancel" onclick="window.location.href='index.html'">✕ Отмена</button>
    </div>

    <script>
        let activeTariffName = "30 дней";
        let basePrice = 299;
        let baseOldPrice = 0;
        let baseDiscount = 0;
        let currentDiscountFromPromo = 0;

        const MY_MERCHANT_ID = "demo_id";

        const promoDatabase = {
            "GAVRIK-4-SALE": 4, "DISC4": 4, "CLIENT4": 4, "MINI4": 4, "SLOW4": 4,
            "GAVRIK-9-PVP": 9, "OP9": 9, "CHEATER9": 9, "FUN9": 9, "LUCKY9": 9,
            "GAVRIK-16-UP": 16, "BOOST16": 16, "MATRIX16": 16, "GERRY16": 16, "BEST16": 16,
            "GAVRIK-20-BOSS": 20, "VIP20": 20, "FOREVER20": 20, "PROMO20": 20, "MYSOF20": 20
        };

        function changeTariff(name, price, oldPrice, discount, element) {
            activeTariffName = name;
            basePrice = price;
            baseOldPrice = oldPrice;
            baseDiscount = discount;
            
            // Исправленное точечное переключение зеленой марки у табов
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            if (name === 'Навсегда') {
                document.getElementById('payTitle').innerText = "Покупка «Клиент 1.21.4 Навсегда»";
            } else {
                document.getElementById('payTitle').innerText = "Покупка «Клиент 1.21.4 на " + name + "»";
            }
            renderPrice();
        }

        function applyPromo() {
            const code = document.getElementById('promoCode').value.trim().toUpperCase();
            const statusLabel = document.getElementById('promoStatus');

            if (code === "") {
                currentDiscountFromPromo = 0;
                statusLabel.innerText = "Промокод не введен";
                statusLabel.style.color = "#666";
                renderPrice();
                return;
            }

            if (promoDatabase[code]) {
                currentDiscountFromPromo = promoDatabase[code];
                statusLabel.innerText = "✓ Промокод активирован! Скидка +" + currentDiscountFromPromo + "%";
                statusLabel.style.color = "#00ff00";
            } else {
                currentDiscountFromPromo = 0;
                statusLabel.innerText = "✕ Неверный промокод";
                statusLabel.style.color = "#ff3333";
            }
            renderPrice();
        }

        function renderPrice() {
            const display = document.getElementById('priceDisplay');
            let finalPrice = basePrice;
            if (currentDiscountFromPromo > 0) {
                finalPrice = Math.round(basePrice * (1 - currentDiscountFromPromo / 100));
            }
            let totalDiscount = baseDiscount + currentDiscountFromPromo;

            if (totalDiscount > 0) {
                let strokePrice = baseOldPrice > 0 ? baseOldPrice : basePrice;
                display.innerHTML = 'К оплатe: <span class="old-price-strike">' + strokePrice + ' ₽</span><span class="price-amount">' + finalPrice + ' ₽</span><span class="discount-badge">Скидка ' + totalDiscount + '%</span>';
            } else {
                display.innerHTML = 'К оплатe:<span class="price-amount">' + finalPrice + ' ₽</span>';
            }
        }

        function executePayment() {
            let finalPriceToSend = basePrice;
            if (currentDiscountFromPromo > 0) {
                finalPriceToSend = Math.round(basePrice * (1 - currentDiscountFromPromo / 100));
            }

            alert("Перенаправляем на защищенный шлюз кассы для оплаты тарифа: " + activeTariffName + " на сумму " + finalPriceToSend + "₽");
            
            // Сохраняем информацию об успешной оплате локально
            const currentUser = localStorage.getItem('username');
            if (currentUser) {
                let userList = JSON.parse(localStorage.getItem('cloud_user_db') || '{}');
                if (userList[currentUser]) {
                    userList[currentUser].hasLicense = 'true';
                    userList[currentUser].licenseType = activeTariffName;
                    
                    const now = new Date();
                    let expirationTime = 0;
                    if (activeTariffName === "30 дней") expirationTime = now.getTime() + (30 * 24 * 60 * 60 * 1000);
                    else if (activeTariffName === "90 дней") expirationTime = now.getTime() + (90 * 24 * 60 * 60 * 1000);
                    
                    userList[currentUser].licenseExpiration = expirationTime;
                    localStorage.setItem('cloud_user_db', JSON.stringify(userList));
                }
            }

            const randomId = Math.floor(Math.random() * 900000) + 100000;
            const orderId = "sub_" + randomId;
            const description = "GavrikClient License: " + activeTariffName;

            // Надежный и прямой запуск платежного шлюза
            window.location.href = "https://aaio.io" + MY_MERCHANT_ID + "&amount=" + finalPriceToSend + "&order_id=" + orderId + "&currency=RUB&desc=" + encodeURIComponent(description);
        }
    </script>
</body>
</html>
